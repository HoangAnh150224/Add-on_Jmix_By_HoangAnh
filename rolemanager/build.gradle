buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath "io.jmix.gradle:jmix-gradle-plugin:3.0.0"
    }
}

group = 'com.qlpv'
version = '0.0.3-SNAPSHOT'

// để root project có task clean
apply plugin: 'base'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'io.jmix'

    repositories {
        mavenCentral()

        maven {
            url = 'https://global.repo.jmix.io/repository/public'
        }

        maven {
            url = 'https://nexus.x2h.com.vn/repository/jmix-internal-snapshots/'

            credentials {
                username = rootProject.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
                password = rootProject.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
            }
        }
    }

    jmix {
        bomVersion = '3.0.0'
        projectId = 'rm'
    }

    group = rootProject.group
    version = rootProject.version

    def props = new Properties()
    buildFile.withInputStream { props.load(it) }

    def subArchivesBaseName = props.getProperty('archivesBaseName')
    def archName = subArchivesBaseName.substring(1, subArchivesBaseName.length() - 1)

    java {
        withSourcesJar()
    }

    artifacts {
        archives sourcesJar
    }

    publishing {
        repositories {
            maven {
                name = 'NexusSnapshots'
                url = uri('https://nexus.x2h.com.vn/repository/jmix-internal-snapshots/')

                credentials {
                    username = rootProject.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
                    password = rootProject.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
                }
            }
        }

        publications {
            javaMaven(MavenPublication) {
                artifactId = archName
                from components.java
            }
        }
    }

    // remove after https://youtrack.jetbrains.com/issue/IDEA-227215 is fixed
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-parameters")
    }
}
